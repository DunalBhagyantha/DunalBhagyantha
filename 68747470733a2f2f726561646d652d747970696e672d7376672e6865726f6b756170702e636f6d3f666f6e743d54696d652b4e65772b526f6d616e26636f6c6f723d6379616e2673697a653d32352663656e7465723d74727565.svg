<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 600 100'
    style='background-color: #10000000;'
    width='600px' height='100px'>

    
                <path id='path0'>
                            <!-- Single line -->
                                <animate id='d0' attributeName='d' begin='0s;d3.end'
                    dur='5000ms' fill='remove'
                    values='m0,50 h0 ; m0,50 h600 ; m0,50 h600 ; m0,50 h0' keyTimes='0;0.8;0.8;1' />
                    </path>
    <text font-family='"Time New Roman", monospace' fill='#36BCF7' font-size='25'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'>
        <textPath xlink:href='#path0'>
            Cybersecurity Student,
        </textPath>
    </text>
        <path id='path1'>
                            <!-- Single line -->
                                <animate id='d1' attributeName='d' begin='d0.end'
                    dur='5000ms' fill='remove'
                    values='m0,50 h0 ; m0,50 h600 ; m0,50 h600 ; m0,50 h0' keyTimes='0;0.8;0.8;1' />
                    </path>
    <text font-family='"Time New Roman", monospace' fill='#36BCF7' font-size='25'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'>
        <textPath xlink:href='#path1'>
            Bug Bounty Hunter,
        </textPath>
    </text>
        <path id='path2'>
                            <!-- Single line -->
                                <animate id='d2' attributeName='d' begin='d1.end'
                    dur='5000ms' fill='remove'
                    values='m0,50 h0 ; m0,50 h600 ; m0,50 h600 ; m0,50 h0' keyTimes='0;0.8;0.8;1' />
                    </path>
    <text font-family='"Time New Roman", monospace' fill='#36BCF7' font-size='25'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'>
        <textPath xlink:href='#path2'>
            Content Writer,
        </textPath>
    </text>
        <path id='path3'>
                            <!-- Single line -->
                                <animate id='d3' attributeName='d' begin='d2.end'
                    dur='5000ms' fill='remove'
                    values='m0,50 h0 ; m0,50 h600 ; m0,50 h600 ; m0,50 h0' keyTimes='0;0.8;0.8;1' />
                    </path>
    <text font-family='"Time New Roman", monospace' fill='#36BCF7' font-size='25'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'>
        <textPath xlink:href='#path3'>
            Active Learner/Researcher..&lt;3
        </textPath>
    </text>
</svg>
